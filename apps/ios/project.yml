name: LLMDictiOS

options:
  bundleIdPrefix: homework
  createIntermediateGroups: true
  defaultConfig: Release
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: iphoneos
    SWIFT_VERSION: "6.0"
  configs:
    Debug:
      COPY_PHASE_STRIP: NO
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS:
        - DEBUG=1
        - $(inherited)
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
    Release:
      COPY_PHASE_STRIP: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  LLMDictiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LLMDictiOS
        excludes:
          - Support/Info.plist
          - .DS_Store
          - "**/.DS_Store"
    info:
      path: LLMDictiOS/Support/Info.plist
      properties:
        NSMicrophoneUsageDescription: Микрофон нужен для записи речи и преобразования её в текст.
        NSBluetoothAlwaysUsageDescription: Bluetooth нужен для подключения диктофона и переноса записей.
        UILaunchStoryboardName: LaunchScreen
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LLMDictiOS
        PRODUCT_NAME: $(TARGET_NAME)
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: 1

  LLMDictiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LLMDictiOSUITests
        excludes:
          - .DS_Store
          - "**/.DS_Store"
    dependencies:
      - target: LLMDictiOS
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.llmdictiosUITests
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: 1
      TEST_TARGET_NAME: LLMDictiOS

  LLMDictiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LLMDictiOSTests
        excludes:
          - .DS_Store
          - "**/.DS_Store"
    dependencies:
      - target: LLMDictiOS
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.llmdictiosTests
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: 1
        TEST_TARGET_NAME: LLMDictiOS

schemes:
  LLMDictiOS:
    build:
      targets:
        LLMDictiOS: all
        LLMDictiOSTests:
          - test
        LLMDictiOSUITests:
          - test
    test:
      config: Debug
      targets:
        - name: LLMDictiOSTests
          parallelizable: false
        - name: LLMDictiOSUITests
          parallelizable: false
      gatherCoverageData: true
    run:
      config: Debug
      executable: LLMDictiOS
      enableGPUFrameCaptureMode: autoEnabled
      debugEnabled: false
    profile:
      config: Release
      executable: LLMDictiOS
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
